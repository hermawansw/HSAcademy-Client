<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHome - Home Visit Fitness Jabodetabek</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            brand: {
                                50: '#f0fdf4',
                                100: '#dcfce7',
                                500: '#22c55e',
                                600: '#16a34a',
                                700: '#15803d',
                            }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col font-sans text-slate-800">

    <!-- NAVIGASI ATAS -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-brand-500 text-white p-1.5 rounded-lg">
                    <i data-lucide="dumbbell" class="w-5 h-5"></i>
                </div>
                <span class="font-extrabold text-lg tracking-wider text-slate-900">FITHOME</span>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
                Area Jabodetabek
            </span>
        </div>
    </header>

    <!-- FORM PEMESANAN UTAMA -->
    <main class="flex-1 max-w-lg mx-auto w-full px-4 py-8">
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6">
            
            <!-- Deskripsi Judul -->
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-bold text-slate-900">Pesan Sesi Home-Visit</h1>
                <p class="text-sm text-slate-500">Latihan kebugaran personal langsung ke rumah Anda.</p>
            </div>

            <!-- Form Pemesanan -->
            <form id="booking-form" class="space-y-4">
                
                <!-- Kategori Layanan -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Kategori Layanan</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-all-200" id="label-pt">
                            <input type="radio" name="kategori_layanan" value="Personal Trainer" required class="sr-only" onchange="updateLayananUI('pt')">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400 mb-1" id="icon-pt"></i>
                            <span class="text-xs font-semibold">PT</span>
                        </label>
                        <label class="border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-all-200" id="label-calis">
                            <input type="radio" name="kategori_layanan" value="Calisthenics" class="sr-only" onchange="updateLayananUI('calis')">
                            <i data-lucide="activity" class="w-5 h-5 text-slate-400 mb-1" id="icon-calis"></i>
                            <span class="text-xs font-semibold text-center">Kalistenik</span>
                        </label>
                        <label class="border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-all-200" id="label-therapy">
                            <input type="radio" name="kategori_layanan" value="Therapy" class="sr-only" onchange="updateLayananUI('therapy')">
                            <i data-lucide="heart" class="w-5 h-5 text-slate-400 mb-1" id="icon-therapy"></i>
                            <span class="text-xs font-semibold">Stretching</span>
                        </label>
                    </div>
                </div>

                <!-- Detail Klien Terdaftar / Baru -->
                <div class="space-y-3 pt-2">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100 pb-1">Data Diri Klien</h3>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="nama_klien" required placeholder="Andi Pratama" 
                               class="w-full px-4 py-2 border border-slate-250 rounded-xl text-sm focus:ring-2 focus:ring-brand-500/25 focus:border-brand-500 outline-none transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                            <input type="email" id="email_klien" required placeholder="andi@email.com" 
                                   class="w-full px-4 py-2 border border-slate-250 rounded-xl text-sm focus:ring-2 focus:ring-brand-500/25 focus:border-brand-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">No. WhatsApp</label>
                            <input type="tel" id="telp_klien" required placeholder="0812XXXXXXXX" 
                                   class="w-full px-4 py-2 border border-slate-250 rounded-xl text-sm focus:ring-2 focus:ring-brand-500/25 focus:border-brand-500 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- Informasi Alamat Kunjungan -->
                <div class="space-y-3 pt-2">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100 pb-1">Lokasi Latihan</h3>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Lengkap</label>
                        <textarea id="alamat_tujuan" required rows="2" placeholder="Tuliskan alamat lengkap rumah, apartemen, atau kantor Anda..." 
                                  class="w-full px-4 py-2 border border-slate-250 rounded-xl text-sm focus:ring-2 focus:ring-brand-500/25 focus:border-brand-500 outline-none transition-all"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kabupaten / Kota</label>
                            <select id="kota_tujuan" required class="w-full px-3 py-2 border border-slate-250 rounded-xl text-sm focus:ring-2 focus:ring-brand-500/25 focus:border-brand-500 outline-none transition-all">
                                <option value="Jakarta">Jakarta</option>
                                <option value="Bogor">Bogor</option>
                                <option value="Depok">Depok</option>
                                <option value="Tangerang">Tangerang</option>
                                <option value="Bekasi">Bekasi</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Waktu Latihan</label>
                            <input type="datetime-local" id="waktu_latihan" required 
                                   class="w-full px-3 py-2 border border-slate-250 rounded-xl text-sm focus:ring-2 focus:ring-brand-500/25 focus:border-brand-500 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" id="submit-btn" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all-200 shadow-lg shadow-brand-100 flex items-center justify-center space-x-2">
                    <i data-lucide="calendar-plus" class="w-5 h-5"></i>
                    <span>Konfirmasi Pemesanan Sesi</span>
                </button>
            </form>
        </div>
    </main>

    <!-- NOTIFIKASI TOAST -->
    <div id="toast" class="hidden fixed bottom-5 right-5 left-5 md:left-auto bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center space-x-3 z-50 transition-all duration-300 transform translate-y-5 opacity-0">
        <div class="bg-brand-500 p-1 rounded-full text-white" id="toast-icon-bg">
            <i data-lucide="check" class="w-5 h-5" id="toast-icon"></i>
        </div>
        <p class="text-sm font-medium" id="toast-msg">Pesan berhasil!</p>
    </div>

    <!-- LOGIKA JAVASCRIPT & SUPABASE INTEGRATION -->
    <script>
        // MASUKKAN KUNCI API SUPABASE ANDA DI SINI
        const SUPABASE_URL = "https://your-supabase-project.supabase.co"; 
        const SUPABASE_ANON_KEY = "your-anon-key";
        
        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL !== "https://your-supabase-project.supabase.co") {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        // Efek UI Kategori Layanan
        function updateLayananUI(layanan) {
            const keys = ['pt', 'calis', 'therapy'];
            keys.forEach(k => {
                const label = document.getElementById(`label-${k}`);
                const icon = document.getElementById(`icon-${k}`);
                if (k === layanan) {
                    label.className = "border-2 border-brand-500 bg-brand-50/50 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer transition-all-200 text-brand-700";
                    icon.className = "w-5 h-5 text-brand-600 mb-1";
                } else {
                    label.className = "border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-all-200 text-slate-700";
                    icon.className = "w-5 h-5 text-slate-400 mb-1";
                }
            });
        }

        // Handle Event Form Submit
        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses Pemesanan...";

            const kategori = document.querySelector('input[name="kategori_layanan"]:checked')?.value;
            const nama = document.getElementById('nama_klien').value;
            const email = document.getElementById('email_klien').value;
            const telp = document.getElementById('telp_klien').value;
            const alamat = document.getElementById('alamat_tujuan').value;
            const kota = document.getElementById('kota_tujuan').value;
            const waktu = document.getElementById('waktu_latihan').value;

            // 1. Validasi Koneksi Supabase
            if(!supabaseClient) {
                // Skenario Mockup jika database belum dikonfigurasi oleh user
                console.warn("Supabase belum dikonfigurasi. Menjalankan skenario mockup.");
                setTimeout(() => {
                    tampilkanToast("Mock Booking berhasil dibuat! Silakan hubungkan Supabase API.", "success");
                    document.getElementById('booking-form').reset();
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i data-lucide="calendar-plus" class="w-5 h-5"></i><span>Konfirmasi Pemesanan Sesi</span>`;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 1500);
                return;
            }

            try {
                // 2. Alur Simpan/Cari Klien terlebih dahulu
                let { data: klien, error: klienError } = await supabaseClient
                    .from('klien')
                    .select('id')
                    .eq('email', email)
                    .maybeSingle();

                let klienId;

                if (!klien) {
                    // Daftarkan klien baru jika belum terdaftar
                    const { data: klienBaru, error: insertError } = await supabaseClient
                        .from('klien')
                        .insert([{ 
                            nama_lengkap: nama, 
                            email: email, 
                            no_telepon: telp, 
                            alamat_utama: alamat, 
                            kota_kabupaten: kota,
                            riwayat_medis: "Pendaftaran via Web"
                        }])
                        .select('id')
                        .single();

                    if (insertError) throw insertError;
                    klienId = klienBaru.id;
                } else {
                    klienId = klien.id;
                }

                // 3. Simpan data ke tabel booking
                const splitWaktu = waktu.split('T');
                const tanggal_latihan = splitWaktu[0];
                const jam_mulai = splitWaktu[1] + ":00";

                const { error: bookingError } = await supabaseClient
                    .from('booking')
                    .insert([{
                        klien_id: klienId,
                        kategori_layanan: kategori,
                        tanggal_latihan: tanggal_latihan,
                        jam_mulai: jam_mulai,
                        latitude_tujuan: -6.200000, // Koordinat default
                        longitude_tujuan: 106.816666,
                        status_booking: "pending_assignment",
                        harga_total: 250000 // Harga tetap untuk MVP (Rp 250.000)
                    }]);

                if (bookingError) throw bookingError;

                tampilkanToast("Pemesanan Berhasil! Tim Admin kami akan segera memproses.", "success");
                document.getElementById('booking-form').reset();

            } catch (err) {
                console.error("Gagal melakukan pemesanan:", err.message);
                tampilkanToast(`Gagal: ${err.message}`, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="calendar-plus" class="w-5 h-5"></i><span>Konfirmasi Pemesanan Sesi</span>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        });

        // Tampilkan Toast Notifikasi
        function tampilkanToast(msg, tipe) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const iconBg = document.getElementById('toast-icon-bg');
            const icon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;
            if(tipe === "success") {
                iconBg.className = "bg-brand-500 p-1 rounded-full text-white";
                icon.setAttribute('data-lucide', 'check');
            } else {
                iconBg.className = "bg-rose-500 p-1 rounded-full text-white";
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('translate-y-5', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('translate-y-5', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 300);
            }, 4000);
        }
    </script>
</body>
</html>
